title: Brute Force Attack Detection
id: 1
status: experimental
description: Обнаружение брутфорса по множеству неудачных попыток входа
author: YuishiZhan
date: 2026/10/07

logsource:
    product: windows
    service: security

detection:
    selection:
        EventID: 4625
    condition: selection | count() by IpAddress > 4
    timeframe: 3m

falsepositives:
    - Ошибочный ввод пароля пользователем
level: high
