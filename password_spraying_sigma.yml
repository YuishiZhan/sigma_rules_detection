title: Password Spraying Detection
id: 3
status: experimental
description: Обнаружение Password Spraying по множеству уникальных пользователей с одного IP
author: YuishiZhan
date: 2026/10/09

logsource:
    product: windows
    service: security

detection:
    selection:
        EventID: 4625
    condition: selection | count(User) by IpAddress > 3
    timeframe: 5m

falsepositives:
    - Опечатка в имени пользователя при вводе
level: high
